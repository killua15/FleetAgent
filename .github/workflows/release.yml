name: Release

# Manual only. Releases are cut on the Mac with `npm run release <version>`
# (`scripts/release.sh`), which builds, signs and publishes to Supabase for
# free. A tag push used to run this — ~130 billable minutes a release, macOS
# counting x10 — for three platforms nobody was updating from.
#
# Kept for the day Windows or Linux are needed: run it from the Actions tab.
on:
  workflow_dispatch:

# The job needs to create the release and upload assets to it.
permissions:
  contents: write

jobs:
  bundle:
    strategy:
      # One platform failing shouldn't withhold the others: a broken Linux
      # bundle is not a reason to leave macOS users without a download.
      fail-fast: false
      matrix:
        include:
          # Two macOS bundles rather than one universal binary: Tauri's
          # universal target builds both architectures anyway, and shipping them
          # separately halves what an Apple Silicon user downloads.
          #
          # `extraArgs` is per-entry because the macOS signing override below is
          # meaningless on Windows *and* unquotable there: the runner's default
          # shell is PowerShell, which doesn't treat single quotes the way the
          # macOS runners' bash does, so the JSON would arrive mangled.
          #
          # `updaterDir` is the bundle subdirectory holding the artifact the
          # updater downloads, and it differs per platform. It's named here
          # rather than derived below because `bundle.targets: "all"` can emit
          # more than one signed artifact on a platform (Windows produces both
          # an NSIS `.exe` and an `.msi`), and picking "whichever `.sig` `find`
          # returned first" would make the published manifest non-deterministic.
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
            updaterDir: macos
            extraArgs: --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
            updaterDir: macos
            extraArgs: --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          # Windows x64 only — no ARM64. `bundle.targets: "all"` turns this into
          # an NSIS `-setup.exe` plus an `.msi`. Unsigned, like the macOS ones:
          # there's no Authenticode certificate for this project, so SmartScreen
          # will warn on first run the way Gatekeeper does. Both are published,
          # but the NSIS one is what the updater carries.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)
            updaterDir: nsis
            extraArgs: ''
          # Ubuntu 22.04 rather than `ubuntu-latest`, deliberately: the glibc a
          # binary is linked against is the *floor* of what it will run on, so
          # building on the newest runner available quietly drops every user on
          # an older distro. 22.04 is also the last LTS carrying
          # `webkit2gtk-4.1`, which Tauri 2 needs.
          #
          # `--bundles deb,appimage` and not "all": the RPM bundler pulls in
          # tooling this job doesn't need, and only the AppImage matters to the
          # updater — Tauri cannot auto-update a `.deb`, so the `.deb` is an
          # install-once convenience and the AppImage is the beta channel.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux (x64)
            updaterDir: appimage
            extraArgs: --bundles deb,appimage

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Linux is the only platform where the webview isn't part of the OS, so
      # Tauri has to link against one. `webkit2gtk-4.1` is what Tauri 2 wants
      # (4.0 is the Tauri 1 line) and `libayatana-appindicator3` backs the tray.
      # `patchelf` and `librsvg2` are what the AppImage bundler shells out to.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - name: Install frontend dependencies
        run: npm ci

      # `tauri-action` runs `beforeBuildCommand` (npm run build) itself, which
      # typechecks and builds the frontend — the Rust crate resolves
      # `frontendDist` at compile time and won't build without it.
      #
      # No `APPLE_CERTIFICATE`/`APPLE_SIGNING_IDENTITY`/etc: those secrets were
      # never actually configured in this repo (`gh secret list` only shows
      # the two `TAURI_SIGNING_PRIVATE_KEY*` ones below). Setting an `env:` key
      # to `${{ secrets.MISSING }}` still *defines* the variable as an empty
      # string rather than leaving it unset, and tauri-bundler's codesign step
      # treats "set but empty" as "try to sign with this" — it tried to
      # `security import` an empty certificate and failed outright, instead of
      # the graceful "no cert, ship unsigned" fallback the comment here used to
      # promise. Add the six back (with real values) the day there's an Apple
      # Developer cert to sign with.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater's own keypair — nothing to do with Apple. This is what
          # lets an unsigned build still deliver updates the app will accept:
          # Gatekeeper is paid once at the first install, not on every fix.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The Supabase project the app signs in against — not in the repo
          # (see `.env.example`); Vite reads these at build time.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        with:
          # `matrix.extraArgs` carries the macOS-only signing override. On those
          # runners it is `--config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'`:
          # `tauri.conf.json`'s `bundle.macOS.signingIdentity` is hardcoded to
          # "Hangar" — a real identity in the *local* keychain this repo's
          # manual `release: vX.Y.Z` commits were built with. A CI runner's
          # keychain has no such identity and `codesign` fails outright
          # ("no identity found") rather than falling back to unsigned. That
          # `--config` overrides just the one field for this invocation —
          # `-` is codesign's own ad-hoc signing, no certificate needed —
          # without touching the committed config a local build still uses.
          # The second `--config` gives the build its update endpoint, which
          # `tauri.conf.json` leaves empty so a fork never asks this project.
          args: --target ${{ matrix.target }} ${{ matrix.extraArgs }} --config '{"plugins":{"updater":{"endpoints":["${{ secrets.SUPABASE_URL }}/functions/v1/updates?target={{target}}&arch={{arch}}&current_version={{current_version}}"]}}}'
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
          releaseName: Hangar ${{ github.ref_type == 'tag' && github.ref_name || 'dev build' }}
          releaseBody: |
            Mission control for your coding agents — parallel agent terminals, each in its own git
            worktree, each under its own account, with rotation when one runs out of quota.

            **macOS** — Apple Silicon (`aarch64`) or Intel (`x86_64`).
            **Windows** — the `-setup.exe` (x64). Requires [Git for Windows](https://git-scm.com/download/win),
            which Hangar uses both for worktrees and as the shell its terminals run in.
            **Linux** — the `.AppImage` (x64) if you want automatic updates, the `.deb` if you'd
            rather it be a package. Tauri can only self-update the AppImage.

            > Unsigned builds. macOS will say the app can't be verified: right-click the app →
            > Open → Open, once. Windows SmartScreen will say "unrecognized app": More info →
            > Run anyway. Both go away when the releases are signed. Linux has no such gate.
          # Draft, so a release is reviewed before the world sees it — and so a
          # half-finished matrix (one arch uploaded, the other still building)
          # is never briefly public as a complete release.
          releaseDraft: true
          prerelease: false

      # Feeds `publish-to-supabase` below — `createUpdaterArtifacts: true`
      # in `tauri.conf.json` makes `tauri-action` emit this `.tar.gz` +
      # `.tar.gz.sig` pair next to the `.app`/`.dmg`, signed with
      # `TAURI_SIGNING_PRIVATE_KEY` above regardless of Apple codesigning.
      # Found by its `.sig` rather than by name: the updater artifact is called
      # something different on every platform (`.app.tar.gz`, `-setup.exe`,
      # `.AppImage`) and the version is in the filename, but `createUpdaterArtifacts`
      # always drops exactly one detached signature beside it. Scoped to
      # `matrix.updaterDir` so a platform that bundles two installers can't make
      # this pick the wrong one.
      #
      # `shell: bash` is required, not cosmetic: the Windows runner defaults to
      # PowerShell, where none of this parses.
      - name: Locate the updater artifact
        id: updater
        shell: bash
        run: |
          set -euo pipefail
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.updaterDir }}"
          sig=$(find "$dir" -maxdepth 1 -name '*.sig' -print -quit)
          if [ -z "$sig" ]; then
            echo "no updater signature under $dir — was TAURI_SIGNING_PRIVATE_KEY set?" >&2
            ls -la "$dir" || echo "(directory does not exist)"
            exit 1
          fi
          echo "artifact=${sig%.sig}" >> "$GITHUB_OUTPUT"
          echo "signature=$sig" >> "$GITHUB_OUTPUT"

      # One artifact per target, so `publish-to-supabase` can publish every
      # platform that built.
      - uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.target }}
          path: |
            ${{ steps.updater.outputs.artifact }}
            ${{ steps.updater.outputs.signature }}
          if-no-files-found: error

  # Where an update comes from: the artifacts go to Supabase Storage and a row
  # per platform goes to `app_releases`, which the `updates` Edge Function reads
  # and gates on `profiles.approved`. `scripts/release.sh` does the same for
  # Apple Silicon from the Mac; this is the path for the other platforms.
  #
  # Tag refs only, since the version comes from the tag: when running it by
  # hand, pick the release's tag (not `main`) in the "Use workflow from" menu.
  #
  # The old `updates/` channel (a manifest and a tarball committed to `main`)
  # is frozen at 0.8.9. Anyone still on it updates once to 0.8.9, which reads
  # this channel, and never needs it again.
  publish-to-supabase:
    needs: bundle
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # Every target, unlike the job above, which takes only Apple Silicon.
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: artifacts

      - name: Upload the artifacts and register the release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # The Rust target triple is what CI builds with; `{os}-{arch}` is what
          # the updater asks with (`updater_os()`/`updater_arch()` in the plugin).
          # The rows have to be keyed by the second, or the app asks for a
          # platform nothing answers to.
          # Pairs rather than an associative array: `declare -A` needs bash 4,
          # which the runner has and macOS's own bash does not, and this script
          # is worth being able to run by hand before spending a build on it.
          targets="
            aarch64-apple-darwin:darwin-aarch64
            x86_64-apple-darwin:darwin-x86_64
            x86_64-pc-windows-msvc:windows-x86_64
            x86_64-unknown-linux-gnu:linux-x86_64
          "

          published=0
          for pair in $targets; do
            triple="${pair%%:*}"
            target="${pair##*:}"
            dir="artifacts/updater-$triple"
            # A platform whose build failed must not fail the release: the matrix
            # is `fail-fast: false` precisely so a broken Linux bundle doesn't
            # withhold macOS. Its row simply isn't written, and its testers stay
            # on what they have.
            if [ ! -d "$dir" ]; then
              echo "::warning::no updater artifact for $triple — skipping $target"
              continue
            fi
            sig=$(find "$dir" -maxdepth 1 -name '*.sig' -print -quit)
            artifact="${sig%.sig}"
            if [ -z "$sig" ] || [ ! -f "$artifact" ]; then
              echo "::warning::no signed artifact under $dir — skipping $target"
              continue
            fi
            signature=$(cat "$sig")
            object_path="$version/$target/$(basename "$artifact")"

            # `x-upsert` so re-running a release over itself replaces the object
            # rather than failing on the second attempt — the whole point of
            # `workflow_dispatch` being available for a re-cut.
            curl --fail-with-body -sS -X POST \
              "$SUPABASE_URL/storage/v1/object/updates/$object_path" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "x-upsert: true" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$artifact" > /dev/null

            # Upserted on (version, target, channel), so a re-cut updates the row
            # in place instead of leaving two rows the function has to choose between.
            curl --fail-with-body -sS -X POST \
              "$SUPABASE_URL/rest/v1/app_releases?on_conflict=version,target,channel" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates" \
              -d "$(python3 -c '
          import json, os, sys
          print(json.dumps({
              "version": sys.argv[1],
              "target": sys.argv[2],
              "object_path": sys.argv[3],
              "signature": sys.argv[4],
              "notes": f"Hangar {sys.argv[1]}",
              "channel": "beta",
              "published": True,
          }))' "$version" "$target" "$object_path" "$signature")" > /dev/null

            echo "published $target → $object_path"
            published=$((published + 1))
          done

          # Zero means the release reached nobody, which is a failed release even
          # though every step "worked".
          if [ "$published" -eq 0 ]; then
            echo "no artifact was published to Supabase" >&2
            exit 1
          fi
