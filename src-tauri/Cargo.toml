[package]
name = "hangar"
version = "0.1.0"
description = "Hangar — mission control for your coding agents"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hangar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what `macOSPrivateApi` in tauri.conf.json requires, and
# it's what makes a genuinely transparent window with vibrancy possible on macOS.
# The name is literal: it uses private Apple APIs, so a build with this feature
# cannot be published on the Mac App Store. Hangar ships as a DMG / GitHub
# release, so that trade is already made — but it's the reason this can't be
# turned on casually.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = "3"
portable-pty = "0.9"
base64 = "0.22"
# The first outgoing HTTP from Rust (ClickUp). `rustls` rather than the system
# TLS stack so the build doesn't depend on whichever OpenSSL the machine has,
# and `blocking` because every other outbound call here already runs inside
# `blocking::run_blocking`.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

